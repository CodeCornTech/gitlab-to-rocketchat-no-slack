name: Validate documentation and examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: Tests (Python standard library)
        run: python3 -m unittest discover -s tests -v
